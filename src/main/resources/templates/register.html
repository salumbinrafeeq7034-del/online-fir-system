<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Online FIR System - Register</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { color: #333; }
        input[type="text"], input[type="password"] { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        .error { color: red; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Citizen Registration</h2>
    
    <div th:if="${param.error}" class="error">
        Registration Failed. Username might already exist!
    </div>

    <form action="/processRegistration" method="POST">
        <input type="text" name="username" placeholder="Choose a Username" required>
        <input type="text" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Choose a Password" required>
        <button type="submit">Register</button>
    </form>
    
    <p style="margin-top: 15px; font-size: 14px;">
        Already have an account? <a href="/login">Back to Login</a>
    </p>
</div>

</body>
</html>
