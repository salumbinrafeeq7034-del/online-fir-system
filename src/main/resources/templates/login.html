<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Online FIR / Complaint Filing System</title>
    <style>
        /* CSS Styling */
        :root {
            --primary-color: #0f766e;
            --secondary-color: #0f867e;
            --bg-color: #ecfeff;
            --text-color: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-control {
            width: 100%;
            padding: 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea.form-control {
            resize: vertical;
            height: 100px;
        }
        
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .error { color: red; margin-bottom: 10px; font-size: 14px; }
        a{ color: #0e566d}
    </style>
</head>
<body>

    <header>
        <h2>⚖️ Online FIR System</h2>
    </header>
<!---------------------------------------login page-------------------------------------------------------->
    <div class="login-container">
        <div id="login-view" class="card">
            <h2>Login / Registration</h2>
            <p style="margin-top: 15px; font-size: 16px;">
                Please log in to file a complaint or access the admin portal.
            </p>
            <div class="form-group">
                <div th:if="${param.error}" class="error">
                   Invalid Username or Password!
                </div>
                <form action="/processLogin" method="POST">
                    <label>Enter Name</label>
                    <input class="form-control" type="text" name="username" placeholder="Username" required>
                    <label>User ID / Email</label>
                    <input class="form-control" type="text" name="email" placeholder="Email" required>
                   <div class="form-group">
                       <label>Password</label>
                       <input class="form-control" input type="password" name="password" placeholder="Password" required>
                  </div>
                     <button type="submit">Login</button>
                </form>
                </div>
             <p style="margin-top: 15px; font-size: 16px;">
                  New Citizen? <a href="/register">Register here</a>
            </p>
        </div>
</body>
</html>
